pre-commit:
  parallel: true
  jobs:
    - name: protect-main
      run: node scripts/protect-main.mjs commit
    - name: biome
      glob: "*.{js,jsx,ts,tsx,json,jsonc,css}"
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    - name: lint-css
      glob: "*.css"
      run: pnpm lint:css
    - name: lint-tw
      glob: "*.tsx"
      run: pnpm lint:tw
    - name: typecheck
      run: pnpm typecheck

pre-push:
  jobs:
    - name: protect-main
      use_stdin: true
      run: node scripts/protect-main.mjs push
    - name: test
      run: pnpm test
    - name: depcruise
      run: pnpm depcruise
    - name: check-structure
      run: pnpm check:structure
